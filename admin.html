<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SickSense | Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Mobile adjustment for stats */
        @media (max-width: 600px) {
            #stats-container {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <nav>
      <div class="nav-container">
          <!-- LOGO ADDED HERE -->
          <h1 style="display: flex; align-items: center; gap: 10px;">
              <img style="width: 50px; height: 50px; border-radius: 50%;" src="logo.jpg" alt="Logo"> 
              SickSense Admin
          </h1>
          <div class="nav-controls">
            <a href="index.html" style="color:white; text-decoration:none; font-size: 0.9rem;">← Back to User View</a>
          </div>
      </div>
    </nav>

    <main class="container">
        <!-- WELCOME BANNER FOR CONSISTENCY -->
        <div class="card welcome-banner" style="margin-bottom: 20px;">
            <p><strong>Administrator Panel</strong></p>
            <p style="font-size: 0.85rem; opacity: 0.9; margin-top: 5px;">Community Health Overview</p>
        </div>

        <div class="dashboard-grid">
            <!-- COMMUNITY TRENDS -->
            <section class="card" style="grid-column: span 2;">
                <div class="card-header">📊 <h2>Community Health Trends</h2></div>
                <div id="stats-container" style="display: flex; justify-content: space-around; text-align: center; padding: 10px 0;">
                    <div><h3 id="stat-fever" style="font-size: 2rem; color: var(--primary);">0</h3><p>Fever</p></div>
                    <div><h3 id="stat-cough" style="font-size: 2rem; color: var(--primary);">0</h3><p>Cough</p></div>
                    <div><h3 id="stat-fatigue" style="font-size: 2rem; color: var(--primary);">0</h3><p>Fatigue</p></div>
                    <div><h3 id="stat-headache" style="font-size: 2rem; color: var(--primary);">0</h3><p>Headache</p></div>
                </div>
            </section>

            <!-- CIVILIAN INQUIRIES -->
            <section class="card history-card" style="grid-column: span 2;">
                <div class="card-header">📨 <h2>Civilian Inquiries</h2></div>
                <div id="admin-inquiry-list">
                    <!-- Inquiries will load here -->
                </div>
            </section>
        </div>
    </main>

    <script>
        window.onload = () => {
            loadStats();
            loadInquiries();
        };

        function loadStats() {
            const logs = JSON.parse(localStorage.getItem('sickSenseLogs')) || [];
            const counts = { Fever: 0, Cough: 0, Fatigue: 0, Headache: 0 };
            logs.forEach(log => {
                log.symptoms.forEach(s => { if(counts.hasOwnProperty(s)) counts[s]++; });
            });
            document.getElementById('stat-fever').textContent = counts.Fever;
            document.getElementById('stat-cough').textContent = counts.Cough;
            document.getElementById('stat-fatigue').textContent = counts.Fatigue;
            document.getElementById('stat-headache').textContent = counts.Headache;
        }

        function loadInquiries() {
            const container = document.getElementById('admin-inquiry-list');
            const inquiries = JSON.parse(localStorage.getItem('sickSenseInquiries')) || [];
            if(inquiries.length === 0) { 
                container.innerHTML = "<p style='color:gray; text-align:center; padding:20px;'>No inquiries yet.</p>"; 
                return; 
            }
            
            container.innerHTML = inquiries.map((iq, index) => `
                <div class="info-box" style="margin-bottom:15px; border-left: 5px solid var(--accent-blue);">
                    <strong>From: ${iq.name}</strong> <small>(${iq.phone})</small><br>
                    <p style="margin: 10px 0;">${iq.message}</p>
                    <small style="color:gray;">${iq.timestamp}</small>
                    <div style="margin-top:10px; display: flex; gap: 10px;">
                        <input type="text" id="reply-${index}" placeholder="Type reply..." style="margin-bottom:0;">
                        <button onclick="alert('Reply sent to ${iq.phone}!')" class="btn-action" style="width:auto; padding:0 15px; margin-top:0;">Reply</button>
                    </div>
                </div>
            `).reverse().join('');
        }
    </script>
</body>
</html>
